[package]
name = "rintedhle-ios-entry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The host app dlopens a core rather than linking it, so that one app can ship
# more than one. Both cores export the same symbols, so they could never have
# been statically linked into the same binary.
name = "rintedhle_core"
crate-type = ["cdylib"]

[dependencies]
RintedHLE = { path = "../../..", default-features = false, features = ["dynamic-sdl"] }

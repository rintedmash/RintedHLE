name: Build RintedHLE

on:
  workflow_dispatch:
    inputs:
      publish_rintedhle_release:
        description: Publish a RintedHLE release (after all builds succeed)
        type: boolean
        default: false
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on trunk queue instead of cancelling each other: a cancelled run never
  # publishes its release, so frequent pushes could otherwise hold releases
  # back indefinitely. Queued runs start after the previous one finishes and
  # so see any tag it published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  build-osx:
    runs-on: macos-latest  

    steps:  
      - name: Checkout RintedHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost  
        id: cache-boost  
        uses: actions/cache@main
        with:  
          path: vendor/boost  
          key: boost_1_81_0_macos  
          
      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
        name: Download Boost  
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"  
        
      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
        name: Extract Boost  
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost  

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Install x86_64 toolchain  
        run: rustup target add x86_64-apple-darwin  
        
      - name: Build  
        run: cargo build --target x86_64-apple-darwin --release  

      - name: Create .app bundle and DMG
        # `hdiutil create` periodically fails on the `macos-15-arm64` GitHub
        # Actions runners with `hdiutil: create failed - Resource busy` when
        # Spotlight (`mds`/`mds_stores`) decides to index `RintedHLE-dmg-src`
        # at the same moment hdiutil tries to snapshot it, or when a stale
        # `/Volumes/RintedHLE` from a previous run hasn't fully detached.
        # Mirror the workaround Apple documents in TN2065 / `hdiutil(1)` —
        # detach any stray attachment, pass `-ov` so an existing image is
        # overwritten cleanly, and retry a few times. See
        # <https://developer.apple.com/library/archive/technotes/tn2065/_index.html>.
        run: |
          set -eu
          cd dev-scripts
          ./make-macos-bundle.sh \
            ../target/x86_64-apple-darwin/release/RintedHLE \
            "`cargo run --package RintedHLE_version`" \
            "`cargo run --package RintedHLE_version -- --branding`"
          mkdir RintedHLE-dmg-src
          mv *.app RintedHLE-dmg-src/
          # Forbid Spotlight from indexing the staging folder so it can't
          # race with hdiutil for an exclusive handle.
          touch RintedHLE-dmg-src/.metadata_never_index || true
          # Tear down any stale mount left over from a previous run.
          if [ -d "/Volumes/RintedHLE" ]; then
            hdiutil detach -force "/Volumes/RintedHLE" || true
          fi
          # Retry hdiutil up to 5 times with growing back-off.
          attempt=1
          max_attempts=5
          until hdiutil create -ov -volname RintedHLE \
              -srcfolder RintedHLE-dmg-src RintedHLE.dmg; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "hdiutil create still failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep_secs=$((attempt * 5))
            echo "hdiutil create failed (attempt $attempt); retrying in ${sleep_secs}s" >&2
            if [ -d "/Volumes/RintedHLE" ]; then
              hdiutil detach -force "/Volumes/RintedHLE" || true
            fi
            sleep "$sleep_secs"
            attempt=$((attempt + 1))
          done
          mv RintedHLE.dmg ..
          
      - uses: actions/upload-artifact@main
        with:
          name: RintedHLE_macOS_x86_64
          path: RintedHLE.dmg

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RintedHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux build dependencies
        # SDL2 and openal-soft are built from source (the `static` feature uses
        # the `bundled` SDL2 build), so the development headers for the audio,
        # video and input backends they detect must be available.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build
        run: cargo build --release

      - name: Create bundle
        run: cd dev-scripts && ./make-linux-bundle.sh ../target/release/RintedHLE && mv RintedHLE_linux_bundle/ ..

      - uses: actions/upload-artifact@main
        with:
          name: RintedHLE_Linux_x86_64
          path: RintedHLE_linux_bundle/

  build-android:
    runs-on: ubuntu-latest  

    steps:  
    - name: Checkout RintedHLE
      uses: actions/checkout@main
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Cache Rust build artifacts
      uses: actions/cache@main
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor/boost  
        key: boost_1_81_0  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost  

    - name: Try to get cached copy of cmake  
      id: cache-cmake  
      uses: actions/cache@main
      with:  
        path: vendor/cmake  
        key: cmake_3_31_6_linux  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Download Cmake  
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Extract Cmake  
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake  

    - name: Install AArch64 Android Rust toolchain  
      run: rustup target add aarch64-linux-android  

    - name: Install cargo-ndk  
      run: cargo install cargo-ndk@3.5.4  

    - name: Try to get a cached copy of Gradle  
      id: cache-gradle  
      uses: actions/cache@main
      with:  
        path: gradle  
        key: gradle-8.11.1  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Download Gradle  
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Extract Gradle  
      run: 7z -ogradle x gradle-8.11.1-bin.zip  

    - name: Try to get a cached copy of Android NDK  
      id: cache-android-ndk  
      uses: actions/cache@main
      with:  
        path: android-ndk  
        key: android-ndk-r25c  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Download Android NDK  
      run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Extract Android NDK  
      run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip  

    - name: Link Android NDK  
      run: ln -s $PWD'/android-ndk/android-ndk-r25c' $ANDROID_SDK_ROOT'/ndk/25.2.9519653'  

    - name: Generate local.properties file  
      run: echo 'sdk.dir='$ANDROID_SDK_ROOT > android/local.properties  

    - name: Build for Android  
      run: cd android && ../gradle/gradle-8.11.1/bin/gradle assembleRelease && mv app/build/outputs/apk/release/RintedHLE-release.apk ../RintedHLE.apk  
      env:  
        RINTEDHLE_KEYSTORE_B64: ${{ secrets.RINTEDHLE_KEYSTORE_B64 }}
        RINTEDHLE_KEYSTORE_PASSWORD: ${{ secrets.RINTEDHLE_KEYSTORE_PASSWORD }}
        RINTEDHLE_KEY_ALIAS: ${{ secrets.RINTEDHLE_KEY_ALIAS }}
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/25.2.9519653'  
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake  

    - uses: actions/upload-artifact@main
      with:  
        name: RintedHLE_Android_AArch64  
        path: RintedHLE.apk

  build-ios:
    # The iOS app (platform/ios) and its packaging come from Applesauce
    # (https://github.com/johnny901901901/Applesauce). This builds the three
    # unsigned/fakesigned IPAs it ships and uploads each one on its own.
    #
    # It waits for check-rintedhle-release only to learn the version a release
    # build will be tagged with; that job is skipped outside trunk pushes and
    # manual runs, and the iOS build runs regardless.
    needs: [check-rintedhle-release]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    env:
      RINTEDHLE_VERSION: ${{ needs.check-rintedhle-release.outputs.should_release == 'true' && needs.check-rintedhle-release.outputs.version || '' }}

    steps:
      - name: Checkout RintedHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          # Full history and tags: the app version comes from the latest
          # release tag and the build number from the commit count.
          fetch-depth: 0
          fetch-tags: true

      - name: Select the newest installed Xcode
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install build tools
        run: brew install ninja ldid

      - name: Install AArch64 iOS Rust toolchain
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master
        with:
          workspaces: ". -> build/rust-ios-native"

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_macos

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build shared SDL2 for iOS
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build the iOS app
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/package-ipa.sh
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh platform/ios/scripts/package-ipa.sh --trollstore-permanent-jit

      - name: Verify the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/verify-ipa.sh dist/RintedHLE-iOS-unsigned.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore dist/RintedHLE-iOS-trollstore.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore-permanent-jit dist/RintedHLE-iOS-trollstore-permanent-jit.ipa

      # Each IPA is uploaded as-is rather than wrapped in a zip.
      - uses: actions/upload-artifact@main
        with:
          path: dist/RintedHLE-iOS-unsigned.ipa
          archive: false

      - uses: actions/upload-artifact@main
        with:
          path: dist/RintedHLE-iOS-trollstore.ipa
          archive: false

      - uses: actions/upload-artifact@main
        with:
          path: dist/RintedHLE-iOS-trollstore-permanent-jit.ipa
          archive: false

  build-win:
    runs-on: windows-2022  

    steps:  
    - name: Checkout RintedHLE
      uses: actions/checkout@main
      with:
        submodules: recursive
        
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@master

    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor\boost  
        key: boost_1_81_0  
        
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  
      
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && ren vendor\boost_1_81_0 boost  

    - name: Setup CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.29.0"

    - name: Build  
      run: cargo build --release  

    - name: Create bundle  
      shell: bash  
      run: cd dev-scripts && ./make-windows-bundle.sh ../target/release/RintedHLE.exe && mv RintedHLE_windows_bundle/ ..  
      
    - uses: actions/upload-artifact@main
      with:  
        name: RintedHLE_Windows_x86_64  
        path: RintedHLE_windows_bundle/

  check-rintedhle-release:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/trunk') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog_from: ${{ steps.check.outputs.changelog_from }}
      changelog_limit: ${{ steps.check.outputs.changelog_limit }}
    steps:
      - name: Checkout RintedHLE
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check whether a RintedHLE release is due
        id: check
        env:
          FORCE_RINTEDHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_rintedhle_release && 'true' || '' }}
        run: ./dev-scripts/rintedhle-should-release.sh

  publish-rintedhle-release:
    needs: [check-rintedhle-release, build-osx, build-linux, build-android, build-win, build-ios]
    if: >-
      needs.check-rintedhle-release.result == 'success' &&
      needs.check-rintedhle-release.outputs.should_release == 'true' &&
      needs.build-osx.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-win.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout RintedHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Download macOS artifact
        uses: actions/download-artifact@main
        with:
          name: RintedHLE_macOS_x86_64
          path: artifacts/macos
      - name: Download Android artifact
        uses: actions/download-artifact@main
        with:
          name: RintedHLE_Android_AArch64
          path: artifacts/android
      - name: Download Windows artifact
        uses: actions/download-artifact@main
        with:
          name: RintedHLE_Windows_x86_64
          path: artifacts/windows
      - name: Download Linux artifact
        uses: actions/download-artifact@main
        with:
          name: RintedHLE_Linux_x86_64
          path: artifacts/linux
      # Unzipped artifacts (upload-artifact archive: false) are documented to
      # download by their exact file name, so fetch each IPA by name.
      - name: Download iOS unsigned IPA
        uses: actions/download-artifact@main
        with:
          name: RintedHLE-iOS-unsigned.ipa
          path: artifacts/ios
      - name: Download iOS TrollStore IPA
        uses: actions/download-artifact@main
        with:
          name: RintedHLE-iOS-trollstore.ipa
          path: artifacts/ios
      - name: Download iOS TrollStore permanent-JIT IPA
        uses: actions/download-artifact@main
        with:
          name: RintedHLE-iOS-trollstore-permanent-jit.ipa
          path: artifacts/ios
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc zip
      - name: Package RintedHLE release files
        env:
          # Lets the changelog look up each commit author's GitHub username.
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FORCE_RINTEDHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_rintedhle_release && 'true' || '' }}
          VERSION: ${{ needs.check-rintedhle-release.outputs.version }}
          CHANGELOG_FROM: ${{ needs.check-rintedhle-release.outputs.changelog_from }}
          CHANGELOG_LIMIT: ${{ needs.check-rintedhle-release.outputs.changelog_limit }}
        run: ./dev-scripts/package-rintedhle-release.sh "$VERSION" "$CHANGELOG_FROM"
      - name: Publish RintedHLE release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-rintedhle-release.outputs.version }}
          # Tag the commit that was built, not whatever trunk points at by now.
          target_commitish: ${{ github.sha }}
          name: RintedHLE ${{ needs.check-rintedhle-release.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/RintedHLE_*.zip
            release/RintedHLE-iOS-*.ipa
          fail_on_unmatched_files: true
